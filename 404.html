<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — TechCorp IT Support Portal</title>
  <link rel="stylesheet" href="design-system.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="text-center animate-slide-up max-w-md p-6">
    <div class="text-6xl font-bold text-gray-200 mb-4 tracking-tighter">404</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Page not found</h1>
    <p class="text-gray-500 mb-8">Sorry, we couldn't find the page you're looking for. It might have been moved or deleted.</p>
    <div class="flex items-center justify-center gap-3">
      <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
      <a href="employee-dashboard.html" class="btn btn-primary">Return Home</a>
    </div>
  </div>
</body>
</html>
