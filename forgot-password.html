<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TechCorp IT Support Portal</title>
  <link rel="stylesheet" href="design-system.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="w-full max-w-md p-6">
    <div class="text-center mb-8 animate-slide-up">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-100 text-blue-600 mb-4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Reset your password</h1>
      <p class="text-sm text-gray-500 mt-1">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="card card-no-hover animate-slide-up" style="animation-delay: 50ms; padding: 32px;">
      <form class="space-y-5">
        <div>
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="name@techcorp.com" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-full justify-center text-base" style="height:44px;">Send reset link</button>
      </form>

      <div class="mt-6 text-center">
        <a href="login.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 inline-flex items-center gap-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
